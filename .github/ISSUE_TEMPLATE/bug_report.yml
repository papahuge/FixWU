name: Bug report
description: Something went wrong while running FixWU.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this! The more of this form you fill in, the faster it can be figured out.

        **Before you post:** if Settings is stuck on "Checking for updates..." or still lists old downloads, try the [Troubleshooting](https://github.com/papahuge/FixWU#troubleshooting) steps first.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to happen instead?
      placeholder: 'e.g. Step 3 said "Couldn''t move SoftwareDistribution aside" three times and the summary listed a failure.'
    validations:
      required: true

  - type: dropdown
    id: how-run
    attributes:
      label: How did you run FixWU?
      options:
        - 'FixWU shortcut from my PowerShell profile'
        - 'powershell -ExecutionPolicy Bypass -File FixWU.ps1'
        - '.\FixWU.ps1 from an admin PowerShell window'
        - 'Other (please describe above)'
    validations:
      required: true

  - type: input
    id: options
    attributes:
      label: Options used
      description: Which switches did you add, if any?
      placeholder: 'e.g. -Repair, -ResetNetwork, -Cleanup'

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: 'Press Win+R, type `winver`, and copy the version and build.'
      placeholder: 'e.g. Windows 11 Pro 24H2 (build 26100.4061)'
    validations:
      required: true

  - type: input
    id: powershell
    attributes:
      label: PowerShell version
      description: 'Run `$PSVersionTable.PSVersion` in the window you used.'
      placeholder: 'e.g. 5.1.26100 or 7.5.2'
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: FixWU log
      description: |
        Paste the log from the run. Its path is printed at the end of every run, like `%TEMP%\FixWU_20261110_231347.log`.
        The log includes your Windows user name and PC name; replace them if you'd rather not share them.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I'm using the latest FixWU release.
        - label: I've removed anything I don't want public from the log (user name, PC name, paths).
          required: true
